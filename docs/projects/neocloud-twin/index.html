<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Compute Command</title>
<meta name="description" content="A synthetic digital twin for a sovereign GPU-as-a-service neocloud: sites, racks, supply chain, contracts, telemetry, workflows and what-if economics.">
<style>
:root{
  --bg:#020402;--bg2:#030603;--panel:#050805;--panel2:#081008;--line:#26482c;--line2:#3f7a4b;
  --g:#6cff5c;--g2:#3fbf35;--gd:#1f5a22;--amber:#ffb347;--red:#ff4a4a;--cyan:#5ce1ff;--mag:#ff5cf0;
  --text:#d2ecc9;--dim:#9dbb96;--white:#f2fbef;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Share Tech Mono","Courier New",ui-monospace,monospace;font-size:15px;line-height:1.4;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);z-index:50;mix-blend-mode:multiply}
.bevel{border:1px solid var(--line);box-shadow:inset 1px 1px 0 #2f5a37,inset -1px -1px 0 #020402,0 0 0 1px #050905;background:linear-gradient(180deg,var(--panel2),var(--panel))}
#app{display:grid;grid-template-rows:44px 1fr 28px;grid-template-columns:190px 1fr 320px;height:100vh;gap:4px;padding:4px}
header{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:0 12px}
header .brand{font-weight:700;letter-spacing:.22em;color:var(--g);text-shadow:0 0 8px rgba(108,255,92,.6);font-size:15px}
header .brand small{color:var(--dim);letter-spacing:.1em;font-size:12px;margin-left:8px}
header .spacer{flex:1}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 6px var(--g);margin-right:6px;vertical-align:middle}
.led.amber{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.led.red{background:var(--red);box-shadow:0 0 6px var(--red);animation:blink 1s steps(2) infinite}
.led.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.hstat{font-size:13px;color:var(--dim);white-space:nowrap}
.hstat b{color:var(--text)}
nav{display:flex;flex-direction:column;gap:3px;padding:6px}
nav button{all:unset;cursor:pointer;display:block;padding:8px 10px;border:1px solid var(--line);background:linear-gradient(180deg,#0a140c,#050905);color:var(--dim);letter-spacing:.12em;font-size:13px;text-transform:uppercase;box-shadow:inset 1px 1px 0 #2a4f31}
nav button:hover{color:var(--text);border-color:var(--line2)}
nav button.on{color:var(--g);border-color:var(--g2);background:linear-gradient(180deg,#14301a,#0b1c0f);text-shadow:0 0 6px rgba(108,255,92,.5)}
nav .k{float:right;color:#4f8a58;font-size:12px}
nav .sep{height:1px;background:var(--line);margin:6px 0}
nav .radar{margin-top:auto;height:160px;position:relative;overflow:hidden}
nav .radar .sweep{position:absolute;left:50%;top:50%;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:conic-gradient(from 0deg,rgba(108,255,92,.45) 0deg,rgba(108,255,92,0) 60deg,rgba(108,255,92,0) 360deg);animation:sweep 4s linear infinite;pointer-events:none}
@keyframes sweep{to{transform:rotate(360deg)}}
main{overflow:auto;padding:10px;position:relative}
aside{display:flex;flex-direction:column;gap:4px;overflow:hidden}
aside .box{flex:1;display:flex;flex-direction:column;min-height:0}
aside .box h3{font-size:12px;letter-spacing:.2em;color:var(--dim);padding:6px 8px;border-bottom:1px solid var(--line)}
aside .list{overflow:auto;padding:4px 8px;font-size:13px}
aside .list div{padding:3px 0;border-bottom:1px dotted #1b3820}
aside .list .t{color:#6f9f77;margin-right:6px}
aside .list .warn{color:var(--amber)}aside .list .crit{color:var(--red)}aside .list .ok{color:var(--g)}
footer{grid-column:1/4;display:flex;align-items:center;gap:20px;padding:0 10px;font-size:12px;color:var(--dim);letter-spacing:.08em}
h1{font-size:15px;letter-spacing:.2em;color:var(--white);margin-bottom:8px;text-transform:uppercase}
h1 small{color:var(--dim);letter-spacing:.05em;font-size:13px;text-transform:none;margin-left:10px}
h2{font-size:13px;letter-spacing:.2em;color:var(--g);text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.grid{display:grid;gap:8px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.c6{grid-template-columns:repeat(6,1fr)}
.p{padding:0 0 8px}
.p .body{padding:6px 8px}
.kpi{padding:8px 10px}
.kpi .l{font-size:12px;letter-spacing:.15em;color:var(--dim);text-transform:uppercase}
.kpi .v{font-size:22px;color:var(--white);margin:2px 0}
.kpi .v.g{color:var(--g)}.kpi .v.a{color:var(--amber)}.kpi .v.r{color:var(--red)}.kpi .v.c{color:var(--cyan)}
.kpi .s{font-size:13px;color:var(--dim)}
.bar{height:8px;background:#060b07;border:1px solid var(--line);position:relative;margin-top:4px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--g2)}
.bar i.a{background:var(--amber)}.bar i.c{background:var(--cyan)}.bar i.r{background:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:normal;color:var(--dim);letter-spacing:.1em;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);text-transform:uppercase;font-size:12px}
td{padding:4px 6px;border-bottom:1px dotted #1b3820;vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:0 5px;border:1px solid var(--line2);font-size:12px;letter-spacing:.08em;color:var(--text)}
.tag.g{color:var(--g);border-color:var(--g2)}.tag.a{color:var(--amber);border-color:var(--amber)}.tag.r{color:var(--red);border-color:var(--red)}.tag.c{color:var(--cyan);border-color:var(--cyan)}.tag.m{color:var(--mag);border-color:var(--mag)}
button.btn{all:unset;cursor:pointer;padding:3px 10px;border:1px solid var(--line2);color:var(--text);font-size:13px;letter-spacing:.1em;text-transform:uppercase;background:#0d1b10;box-shadow:inset 1px 1px 0 #2f5a37}
button.btn:hover{border-color:var(--g);color:var(--g)}
button.btn.r{border-color:#7a2a2a;color:#ff9a9a}button.btn.r:hover{border-color:var(--red);color:var(--red)}
button.btn:disabled{opacity:.4;cursor:default}
.subtabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.subtabs button{all:unset;cursor:pointer;padding:4px 10px;border:1px solid var(--line);color:var(--dim);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.subtabs button.on{color:var(--g);border-color:var(--g2);background:#0f2213}
.rackgrid{display:grid;gap:2px;grid-template-columns:repeat(var(--cols),1fr)}
.rk{aspect-ratio:1;border:1px solid #060b07;cursor:pointer;position:relative}
.rk:hover{outline:1px solid var(--white);z-index:2}
.rk.sel{outline:2px solid var(--white);z-index:3}
.st-planned{background:#152016}.st-ordered{background:#1b2a3a}.st-delivered{background:#2d4a6b}.st-installed{background:#5a5320}.st-commissioned{background:#8a7a1a}.st-accepted{background:#2f7a34}.st-live{background:#3fbf35}.st-degraded{background:#c77a1a}.st-maintenance{background:#7a4ad0}.st-fault{background:#d23a3a}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:middle;border:1px solid #0a150c}
.site-img{width:100%;height:150px;object-fit:cover;filter:saturate(.6) contrast(1.1) brightness(.85);border:1px solid var(--line);display:block}
.site-img-wrap{position:relative}
.site-img-wrap span{position:absolute;left:8px;bottom:8px;background:rgba(2,4,2,.85);padding:2px 8px;font-size:13px;letter-spacing:.15em;color:var(--g);border:1px solid var(--gd)}
canvas{display:block;width:100%;background:#030503;border:1px solid var(--line)}
.sl{display:grid;grid-template-columns:210px 1fr 80px;gap:8px;align-items:center;padding:4px 8px;font-size:13px}
.sl input[type=range]{width:100%;accent-color:var(--g2)}
.sl .val{text-align:right;color:var(--white);font-variant-numeric:tabular-nums}
.check{list-style:none}
.check li{padding:3px 0;border-bottom:1px dotted #1b3820;font-size:13px}
.check li::before{content:"■";margin-right:8px;color:var(--gd)}
.check li.ok::before{color:var(--g)}.check li.warn::before{color:var(--amber)}.check li.bad::before{color:var(--red)}
.gantt{display:grid;grid-template-columns:160px 1fr;gap:2px 8px;font-size:13px;align-items:center}
.gantt .row{height:16px;position:relative;background:#081009;border:1px solid #14261a}
.gantt .row i{position:absolute;top:2px;bottom:2px;background:var(--gd)}
.gantt .row i.now{background:var(--g2)}.gantt .row i.slip{background:var(--amber)}
.gantt .row b{position:absolute;top:0;bottom:0;width:1px;background:var(--red)}
.steps{list-style:none}
.steps li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:5px 6px;border-bottom:1px dotted #1b3820;font-size:13px;align-items:center}
.steps li .n{color:var(--dim)}
.steps li.done .n{color:var(--g)}.steps li.wait .n{color:var(--amber)}.steps li.ai .n{color:var(--mag)}.steps li.rej .n{color:var(--red)}
.mono{white-space:pre;font-size:13px;line-height:1.45;color:#b8dbb0;overflow:auto}
.telerow{display:grid;grid-template-columns:130px repeat(6,1fr);gap:4px;font-size:13px;padding:3px 6px;border-bottom:1px dotted #1b3820;align-items:center}
.telerow.head{color:var(--dim);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.spark{height:16px;width:100%}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:13px}
.pipe .n{padding:6px;border:1px solid var(--line);background:#040704;min-height:86px}
.pipe .n b{display:block;color:var(--cyan);letter-spacing:.1em;margin-bottom:4px;font-weight:normal}
.pipe .n.core{border-color:var(--g2)}.pipe .n.core b{color:var(--g)}
.muted{color:var(--dim)}
.small{font-size:13px}
.right{text-align:right}
.risk{display:inline-block;width:60px;height:6px;background:#060b07;border:1px solid var(--line);vertical-align:middle;margin-right:6px}
.risk i{display:block;height:100%;background:var(--amber)}
.err{position:fixed;left:10px;bottom:36px;background:#3a0c0c;color:#ffb3b3;padding:8px 12px;border:1px solid var(--red);z-index:99;font-size:13px;max-width:60vw}
@media (max-width:1100px){#app{grid-template-columns:150px 1fr 240px}}
@media (max-width:860px){#app{grid-template-columns:1fr;grid-template-rows:44px auto 1fr 26px}nav{flex-direction:row;flex-wrap:wrap}nav .radar,nav .sep{display:none}aside{display:none}.c4,.c6,.c3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app">
  <header class="bevel">
    <span class="brand">AURORA COMPUTE<small>SOVEREIGN AI FACTORY COMMAND</small></span>
    <span class="hstat"><span class="led"></span>TELEMETRY <b id="h-tel">--</b></span>
    <span class="hstat"><span class="led amber blink"></span>WORKFLOWS <b id="h-wf">--</b></span>
    <span class="hstat"><span class="led" id="h-led"></span>ALERTS <b id="h-al">--</b></span>
    <span class="spacer"></span>
    <span class="hstat">WEEK <b id="h-week">0</b> · <b id="h-clock">--:--:--</b> AEST</span>
  </header>
  <nav class="bevel" id="nav"></nav>
  <main class="bevel" id="main"></main>
  <aside>
    <div class="box bevel"><h3>ALERTS</h3><div class="list" id="alerts"></div></div>
    <div class="box bevel"><h3>AUDIT LOG</h3><div class="list" id="audit"></div></div>
  </aside>
  <footer class="bevel">
    <span>CONTROLS: every number on this screen is synthetic and deterministic (seeded). No real company, contract or customer is represented.</span>
    <span class="spacer" style="flex:1"></span>
      </footer>
</div>
<script>
(function(){
"use strict";
window.addEventListener("error",e=>{const d=document.createElement("div");d.className="err";d.textContent="JS error: "+e.message+" @"+e.lineno;document.body.appendChild(d);});

// ---------- PRNG ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(20261001);
const rnd=(a,b)=>a+(b-a)*R();
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(R()*a.length)];
const fmt=n=>n.toLocaleString("en-AU",{maximumFractionDigits:0});
const f1=n=>n.toLocaleString("en-AU",{maximumFractionDigits:1,minimumFractionDigits:1});
const usd=n=>(n<0?"-":"")+"US$"+(Math.abs(n)>=1000?f1(Math.abs(n)/1000)+"B":fmt(Math.abs(n))+"M");
const pct=n=>(n*100).toFixed(0)+"%";
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

// ---------- MODEL ----------
const NOW_WEEK=0; // week 0 = today. Schedule weeks relative to today. Negative = already happened.
const SITES=[
  {id:"M3",name:"NEXTDC M3",city:"West Footscray, Melbourne",addr:"25 Indwe Street, West Footscray VIC 3012",img:"img/m3.jpg",mw:100,halls:["Hall 3A","Hall 3B","Hall 3C"],gb300:300,b200:14,energise:[-30,-6,18],x:0.32,y:0.80,lat:-37.80,lng:144.87},
  {id:"SY3",name:"Equinix SY3",city:"Alexandria, Sydney",addr:"47 Bourke Road, Alexandria NSW 2015",img:"img/sy3.jpg",mw:70,halls:["Suite 2","Suite 4"],gb300:150,b200:40,energise:[-40,10],x:0.72,y:0.55,lat:-33.91,lng:151.19},
  {id:"SY5",name:"Equinix SY5",city:"Alexandria, Sydney",addr:"Unit B, 200 Bourke Road, Alexandria NSW 2015",img:"img/sy5.jpg",mw:42,halls:["Suite 1","Suite 3"],gb300:106,b200:0,energise:[-12,26],x:0.74,y:0.60,lat:-33.92,lng:151.19},
];
const STATES=["planned","ordered","delivered","installed","commissioned","accepted","live","degraded","maintenance","fault"];
const RACKS=[];
(function buildRacks(){
  let n=0;
  for(const s of SITES){
    const total=s.gb300+s.b200;
    // baseline install schedule: staggered across halls, spread from week -34 to week +60
    const perHall=Math.ceil(total/s.halls.length);
    for(let i=0;i<total;i++){
      const hall=s.halls[Math.min(Math.floor(i/perHall),s.halls.length-1)];
      const hi=s.halls.indexOf(hall);
      const type=i<s.gb300?"GB300 NVL72":"HGX B200";
      const gpus=type==="GB300 NVL72"?72:32;
      const kw=type==="GB300 NVL72"?ri(122,138):ri(38,44);
      const base=s.energise[hi]||s.energise[s.energise.length-1];
      const installWeek=base+Math.floor((i-hi*perHall)/perHall*40)+ri(0,3);
      const r={id:s.id+"-"+hall.replace(/\s/g,"")+"-"+String(i%perHall+1).padStart(3,"0"),site:s.id,hall,pos:i%perHall,type,gpus,kw,tonnes:type==="GB300 NVL72"?1.5:0.9,
        installWeek,cust:null,risk:rnd(0.01,0.12),seed:R(),temp:rnd(52,68),util:rnd(.55,.98),flow:rnd(28,36),nvl:ri(0,3),q:ri(0,40),n:n++};
      RACKS.push(r);
    }
  }
})();
// customers
const CONTRACTS=[
  {id:"C-001",name:"Anchor vendor MSA",kind:"anchor",gpus:40032,mwIT:72,years:6,tcv:4900,floor:2.33,start:-8,deposit:0,lc:"n/a",status:"active",notes:"Take-or-pay floor on reserved capacity, upside split above floor"},
  {id:"C-002",name:"Frontier lab (NZ)",kind:"top",gpus:9216,mwIT:18,years:5,tcv:1320,floor:2.9,start:30,deposit:120,lc:"LC US$110M received",status:"pre-deployment",notes:"Revenue from 1H 2027"},
  {id:"C-003",name:"Regional SI (India)",kind:"top",gpus:8200,mwIT:15,years:5,tcv:1250,floor:2.8,start:2,deposit:23,lc:"LC US$140M outstanding",status:"at risk",notes:"Intermediary for an end customer; LC not posted; RBI localisation query open"},
  {id:"C-004",name:"APAC platform co",kind:"top",gpus:6144,mwIT:12,years:5,tcv:950,floor:3.1,start:-4,deposit:144,lc:"Escrow released on acceptance",status:"active",notes:"First acceptance passed"},
  {id:"C-005",name:"AI platform (global)",kind:"top",gpus:2048,mwIT:4,years:5,tcv:373,floor:3.4,start:14,deposit:37,lc:"Bank guarantee received",status:"pre-deployment",notes:"Revenue Q1 2027"},
  {id:"C-006",name:"Design SaaS + GPU reseller",kind:"top",gpus:1024,mwIT:1.2,years:3,tcv:48,floor:2.6,start:-50,deposit:0,lc:"n/a",status:"active",notes:"H200/B200 on-demand and reserved"},
];
// assign racks to contracts by install order
(function assign(){
  const sorted=[...RACKS].sort((a,b)=>a.installWeek-b.installWeek);
  const pools=CONTRACTS.map(c=>({c,left:c.gpus}));
  for(const r of sorted){
    if(r.type==="HGX B200"){r.cust="C-006";continue;}
    const cand=pools.filter(p=>p.left>=72);const p=cand.sort((a,b)=>b.left/b.c.gpus-a.left/a.c.gpus)[0];
    if(p){r.cust=p.c.id;p.left-=72}else r.cust="SPOT";
  }
})();

// what-if parameters
const P={slip:0,capex:0,opex:0,tcv:0,floor:2.33,split:50,util:78,market:4.2};
const CASH0=1860; // US$M
const RACK_CAPEX=5.2; // US$M per NVL72 incl network/storage share
const B200_CAPEX=1.1;
const COLO_PER_MW_YR=3.4; // US$M per MW IT per year incl power
const SGA_YR=60, INT_YR=54;

function rackState(r,week){
  const w=r.installWeek+P.slip;
  if(week<w-16)return"planned";
  if(week<w-8)return"ordered";
  if(week<w-2)return"delivered";
  if(week<w)return"installed";
  if(week<w+3)return"commissioned";
  if(week<w+5)return"accepted";
  // live with faults
  const h=(r.seed*1000+week)%1;
  if(r.risk>0.09&&h<0.35)return"degraded";
  if(r.seed<0.03&&week%9===0)return"maintenance";
  if(r.risk>0.11&&h<0.08)return"fault";
  return"live";
}
function fleet(week){
  const o={};for(const s of STATES)o[s]=0;
  let gpusLive=0,gpusAcc=0,gpusDel=0,kwLive=0,gpusContracted=0;
  for(const r of RACKS){const st=rackState(r,week);o[st]++;
    const live=["accepted","live","degraded","maintenance"].includes(st);
    if(live){gpusLive+=r.gpus;kwLive+=r.kw}
    if(["accepted","live","degraded","maintenance","fault","commissioned"].includes(st))gpusAcc+=r.gpus;
    if(!["planned","ordered"].includes(st))gpusDel+=r.gpus;
    if(r.cust&&r.cust!=="SPOT")gpusContracted+=r.gpus;
  }
  return{states:o,gpusLive,gpusAcc,gpusDel,kwLive,gpusContracted,gpusTotal:RACKS.reduce((a,r)=>a+r.gpus,0)};
}
// quarterly model, 14 quarters from Q4 2026
const QUARTERS=[];for(let i=0;i<14;i++){const y=2026+Math.floor((3+i)/4);const q=((3+i)%4)+1;QUARTERS.push({label:"Q"+q+" "+y,w0:i*13,w1:i*13+13})}
function model(){
  const out=[];let cash=CASH0,cum=0,be=null;
  const site={};for(const s of SITES)site[s.id]={flows:[],capex:0};
  for(const [qi,q] of QUARTERS.entries()){
    let rev=0,revFloor=0,revOther=0,revUp=0,capex=0,colo=0;const sr={};for(const s of SITES)sr[s.id]={rev:0,capex:0,colo:0};
    for(const r of RACKS){
      const w=r.installWeek+P.slip;
      if(w>=q.w0&&w<q.w1){const c=(r.type==="GB300 NVL72"?RACK_CAPEX:B200_CAPEX)*(1+P.capex/100);capex+=c;sr[r.site].capex+=c;site[r.site].capex+=c}
      // revenue weeks live in quarter (live from w+5)
      const liveFrom=w+5;const wl=Math.max(0,Math.min(q.w1,Infinity)-Math.max(q.w0,liveFrom));
      if(wl<=0)continue;
      const hrs=wl*7*24;const gpuH=r.gpus*hrs;
      const c=CONTRACTS.find(c=>c.id===r.cust);
      let rr=0;
      if(c&&c.kind==="anchor"){const fl=gpuH*P.floor/1e6;const up=Math.max(0,P.market-P.floor)*gpuH*(P.util/100)/1e6*(1-P.split/100);rr=fl+up;revFloor+=fl;revUp+=up}
      else if(c){const t=c.tcv*(1+P.tcv/100);const perGpuH=t/(c.gpus*c.years*8760);rr=gpuH*perGpuH*(c.status==="at risk"?0.55:1);revOther+=rr}
      else{rr=gpuH*P.market*0.6*(P.util/100)/1e6;revOther+=rr}
      rev+=rr;sr[r.site].rev+=rr;
      const cl=r.kw/1000*COLO_PER_MW_YR/4*(1+P.opex/100)*(wl/13);colo+=cl;sr[r.site].colo+=cl;
    }
    const opex=colo+SGA_YR/4+INT_YR/4;
    const net=rev-opex-capex;cash+=net;cum+=net;
    if(be===null&&rev-opex>0&&qi>0)be=q.label;
    for(const s of SITES)site[s.id].flows.push(sr[s.id].rev-sr[s.id].colo-sr[s.id].capex);
    out.push({q:q.label,rev,revFloor,revOther,revUp,capex,opex,net,cash});
  }
  const irr={};for(const s of SITES){const fl=site[s.id].flows.slice();for(let k=0;k<12;k++)fl.push(fl[fl.length-1]*0.97);irr[s.id]=IRR(fl)}
  return{rows:out,be,irr,minCash:Math.min(...out.map(r=>r.cash))};
}
function IRR(flows){let lo=-0.9,hi=3;const npv=r=>flows.reduce((a,f,i)=>a+f/Math.pow(1+r,i/4),0);if(npv(lo)*npv(hi)>0)return null;for(let i=0;i<80;i++){const m=(lo+hi)/2;if(npv(m)>0)lo=m;else hi=m}return(lo+hi)/2}

function pipelineSvg(){
  const box=(x,y,w,h,title,lines,cls)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" class="c4 ${cls||""}"/><text x="${x+10}" y="${y+20}" class="c4t">${title}</text>${lines.map((l,i)=>`<text x="${x+10}" y="${y+40+i*17}" class="c4l">${l}</text>`).join("")}`;

  return `<svg viewBox="0 0 1240 660" width="100%" style="display:block;background:#030503;border:1px solid var(--line)">

// ---------- BIND ----------
function bind(){
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{SITE=b.dataset.s;SELRACK=null;render()});
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{DSUB=b.dataset.d;render()});
  document.querySelectorAll(".rk").forEach(b=>b.onclick=()=>{SELRACK=b.dataset.r;log("inspect "+SELRACK);render()});
  document.querySelectorAll("[data-wf]").forEach(b=>b.onclick=()=>wfAct(b.dataset.wf,b.dataset.ok==="1"));
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{log(b.dataset.act+" on "+b.dataset.r,"warn");alert(b.dataset.act+" requested on "+b.dataset.r,"warn")});
  document.querySelectorAll("input[data-p]").forEach(i=>i.oninput=()=>{P[i.dataset.p]=Number(i.value);const v=document.getElementById("v-"+i.dataset.p);if(v)v.textContent=i.dataset.p==="floor"||i.dataset.p==="market"?"US$"+Number(i.value).toFixed(2):i.value+(i.dataset.p==="slip"?" wk":"%");
    // only redraw outputs
    if(TAB==="whatif"){const m=document.getElementById("main");const keep=m.querySelector(".grid").children[0];const html=whatif();const tmp=document.createElement("div");tmp.innerHTML=html;const fresh=tmp.querySelector(".grid").children[1];m.querySelector(".grid").children[1].replaceWith(fresh);drawW()}});
  const rs=document.getElementById("reset");if(rs)rs.onclick=()=>{Object.assign(P,{slip:0,capex:0,opex:0,tcv:0,floor:2.33,split:50,util:78,market:4.2});log("what-if levers reset");render()};
  if(TAB==="command"){drawMap();drawCmd()}
  if(TAB==="whatif")drawW();
  if(TAB==="ml")drawFc();
  if(TAB==="sites"&&SELRACK)drawSpark();
  document.getElementById("h-week").textContent=NOW_WEEK;
}

// ---------- CANVAS ----------
function ctx(id){const c=document.getElementById(id);if(!c)return null;const dpr=window.devicePixelRatio||1;const W=Number(c.dataset.w||c.getAttribute("width")),H=Number(c.dataset.h||c.getAttribute("height"));c.dataset.w=W;c.dataset.h=H;c.width=W*dpr;c.height=H*dpr;c.style.height="auto";const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);g.font="13px monospace";return g}
function axes(g,W,H,pad){g.strokeStyle="#1f3a24";g.lineWidth=1;g.beginPath();g.moveTo(pad,8);g.lineTo(pad,H-pad);g.lineTo(W-8,H-pad);g.stroke()}
function drawCmd(){const g=ctx("cmdchart");if(!g)return;const W=640,H=300,pad=40;const m=model();axes(g,W,H,pad);const n=m.rows.length;const mx=Math.max(...m.rows.map(r=>Math.max(r.rev,r.opex+r.capex)))*1.1;const cx=Math.max(...m.rows.map(r=>Math.abs(r.cash)))*1.1;const bw=(W-pad-16)/n;
  m.rows.forEach((r,i)=>{const x=pad+i*bw;const h=v=>(H-pad)-v/mx*(H-pad-44);g.fillStyle="#3fbf35";g.fillRect(x+3,h(r.rev),bw*0.35,(H-pad)-h(r.rev));g.fillStyle="#ffb347";g.fillRect(x+3+bw*0.4,h(r.opex),bw*0.25,(H-pad)-h(r.opex));g.fillStyle="#ff4a4a";g.fillRect(x+3+bw*0.4,h(r.opex+r.capex),bw*0.25,h(r.opex)-h(r.opex+r.capex));g.fillStyle="#c9e3c2";g.font="12px monospace";if(i%2===0)g.fillText(r.q,x+2,H-pad+16)});
  g.strokeStyle="#5ce1ff";g.lineWidth=2;g.beginPath();m.rows.forEach((r,i)=>{const x=pad+i*bw+bw/2;const y=40+((H-pad-40)/2)-(r.cash/cx)*((H-pad-40)/2-8);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();legend(g,pad,10,[["#3fbf35","revenue"],["#ffb347","opex"],["#ff4a4a","capex"],["line#5ce1ff","cash balance "+usd(m.rows.at(-1).cash)+" (right axis)"]],W-pad-8);g.fillStyle="#c9e3c2";g.font="13px monospace";g.fillText("bars US$M, max "+usd(mx),pad+4,44)}
function legend(g,x0,y0,items,maxW){g.font="13px monospace";let x=x0,y=y0+12;for(const [c,t] of items){const w=22+g.measureText(t).width+22;if(x+w>x0+maxW){x=x0;y+=20}if(c.startsWith("line")){g.strokeStyle=c.slice(4);g.lineWidth=2;g.setLineDash([]);g.beginPath();g.moveTo(x,y-4);g.lineTo(x+16,y-4);g.stroke()}else if(c.startsWith("dash")){g.strokeStyle=c.slice(4);g.lineWidth=2;g.setLineDash([4,4]);g.beginPath();g.moveTo(x,y-4);g.lineTo(x+16,y-4);g.stroke();g.setLineDash([])}else{g.fillStyle=c;g.fillRect(x,y-11,14,14)}g.fillStyle="#e6f5e0";g.fillText(t,x+22,y);x+=w}return y+10}
function drawW(){const g=ctx("wchart");if(!g)return;const W=900,H=380,pad=44;const m=model();const top=legend(g,pad,6,[["#1f6b2a","anchor floor (guaranteed)"],["#5ce15a","other take-or-pay"],["#d8ffb0","upside above floor"],["line#5ce1ff","cash balance (right axis)"],["dash#ff4a4a","zero cash"],["dash#ffb347","break-even quarter"]],W-pad-8)+8;axes(g,W,H,pad);const n=m.rows.length;const mx=Math.max(...m.rows.map(r=>r.rev))*1.15||1;const bw=(W-pad-16)/n;const PH=H-pad-top;const cmax=Math.max(CASH0,...m.rows.map(r=>Math.abs(r.cash)))*1.1;
  m.rows.forEach((r,i)=>{const x=pad+i*bw;const h=v=>(H-pad)-v/mx*PH;let y0=H-pad;for(const [k,c] of [["revFloor","#1f6b2a"],["revOther","#5ce15a"],["revUp","#d8ffb0"]]){const y=h(r[k]);g.fillStyle=c;g.fillRect(x+4,y0-((H-pad)-y),bw*0.55,(H-pad)-y);y0-=((H-pad)-y)}g.fillStyle="#c9e3c2";g.font="12px monospace";g.fillText(r.q,x+2,H-pad+16)});
  g.strokeStyle="#5ce1ff";g.lineWidth=2;g.beginPath();m.rows.forEach((r,i)=>{const x=pad+i*bw+bw*0.3;const y=(H-pad)-((r.cash+cmax)/(2*cmax))*PH;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();
  g.strokeStyle="#ff4a4a";g.setLineDash([4,4]);g.beginPath();const yz=(H-pad)-(cmax/(2*cmax))*PH;g.moveTo(pad,yz);g.lineTo(W-8,yz);g.stroke();g.setLineDash([]);
  g.fillStyle="#c9e3c2";g.font="13px monospace";g.fillText("bars US$M, max "+usd(mx),pad+4,top+14);
  if(m.be){const i=m.rows.findIndex(r=>r.q===m.be);const x=pad+i*bw+bw*0.3;g.strokeStyle="#ffb347";g.lineWidth=2;g.setLineDash([6,4]);g.beginPath();g.moveTo(x,top);g.lineTo(x,H-pad);g.stroke();g.setLineDash([]);g.fillStyle="#ffb347";g.font="13px monospace";g.fillText("break-even "+m.be,x+6,top+30)}}
function drawFc(){const g=ctx("fc");if(!g)return;const W=420,H=220,pad=30;axes(g,W,H,pad);const r2=mulberry32(7);let base=180;const pts=[];for(let i=0;i<26;i++){base=base*1.03+ (r2()-0.5)*30;pts.push(base)}const mx=Math.max(...pts)*1.5;const X=i=>pad+i/25*(W-pad-10),Y=v=>(H-pad)-v/mx*(H-pad-10);
  g.fillStyle="rgba(92,225,255,.15)";g.beginPath();pts.forEach((v,i)=>{const y=Y(v*1.25);i?g.lineTo(X(i),y):g.moveTo(X(i),y)});for(let i=25;i>=0;i--)g.lineTo(X(i),Y(pts[i]*0.8));g.closePath();g.fill();
  g.strokeStyle="#5ce1ff";g.lineWidth=2;g.beginPath();pts.forEach((v,i)=>{i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v))});g.stroke();g.strokeStyle="#ff4a4a";g.setLineDash([3,3]);g.beginPath();g.moveTo(X(12),10);g.lineTo(X(12),H-pad);g.stroke();g.setLineDash([]);g.fillStyle="#c9e3c2";g.font="13px monospace";g.fillText("now",X(12)+4,22);g.fillText("k GPU-h/wk",pad+4,14)}
function drawSpark(){const g=ctx("spark");if(!g)return;const r=RACKS.find(x=>x.id===SELRACK);const r2=mulberry32(Math.floor(r.seed*1e6));g.strokeStyle="#3fbf35";g.beginPath();for(let i=0;i<60;i++){const v=r.util+(r2()-0.5)*0.2;const y=40-v*36;i?g.lineTo(i*4,y):g.moveTo(i*4,y)}g.stroke()}
function drawMap(){const g=ctx("map");if(!g)return;const W=640,H=300;g.strokeStyle="#14261a";for(let x=0;x<W;x+=32){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<H;y+=32){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  // crude east-coast outline
  g.strokeStyle="#2f5a37";g.lineWidth=2;g.beginPath();[[0.15,0.05],[0.35,0.03],[0.55,0.1],[0.68,0.25],[0.78,0.45],[0.76,0.62],[0.62,0.8],[0.45,0.9],[0.3,0.86],[0.15,0.7],[0.08,0.4]].forEach(([x,y],i)=>i?g.lineTo(x*W,y*H):g.moveTo(x*W,y*H));g.stroke();
  for(const s of SITES){const rs=RACKS.filter(r=>r.site===s.id);const deg=rs.filter(r=>["degraded","fault"].includes(rackState(r,NOW_WEEK))).length;const live=rs.filter(r=>rackState(r,NOW_WEEK)==="live").length;const x=s.x*W,y=s.y*H;g.fillStyle=deg>3?"#ffb347":"#6cff5c";g.beginPath();g.arc(x,y,5,0,7);g.fill();g.strokeStyle=g.fillStyle;g.globalAlpha=.4;g.beginPath();g.arc(x,y,10+((Date.now()/60)%10),0,7);g.stroke();g.globalAlpha=1;g.fillStyle="#e6f5e0";g.font="13px monospace";g.fillText(s.id+" · "+live+" live",x+12,y+5)}
  g.fillStyle="#c9e3c2";g.font="13px monospace";g.fillText("sovereign region: AU east · NZ site planned",8,H-8)}
function drawRadar(){const c=document.getElementById("radar");if(!c)return;const g=c.getContext("2d");const W=c.width,H=c.height,cx=W/2,cy=H/2,R0=62;g.clearRect(0,0,W,H);g.strokeStyle="#1f3a24";for(const r of [20,40,62]){g.beginPath();g.arc(cx,cy,r,0,7);g.stroke()}g.beginPath();g.moveTo(cx-R0,cy);g.lineTo(cx+R0,cy);g.moveTo(cx,cy-R0);g.lineTo(cx,cy+R0);g.stroke();
    for(const s of SITES){const x=cx+(s.x-0.5)*R0*1.6,y=cy+(s.y-0.5)*R0*1.6;g.fillStyle="#6cff5c";g.beginPath();g.arc(x,y,2.5,0,7);g.fill()}
  for(const w of WORKFLOWS){if(w.steps.some(s=>s.state==="wait")){const x=cx+Math.cos(w.id.charCodeAt(5))*40,y=cy+Math.sin(w.id.charCodeAt(5)*3)*40;g.fillStyle="#ffb347";g.fillRect(x-2,y-2,4,4)}}}

// ---------- LIVE TICK ----------
let tick=0;
setInterval(()=>{tick++;
  const r2=mulberry32(tick*7919);
  for(const r of RACKS){if(rackState(r,NOW_WEEK)==="planned")continue;r.util=Math.min(1,Math.max(0.2,r.util+(r2()-0.5)*0.04));r.temp=Math.min(74,Math.max(48,r.temp+(r2()-0.5)*0.6+(r.risk>0.09?0.05:0)));r.flow=Math.max(20,r.flow+(r2()-0.5)*0.3);if(r2()<0.02)r.nvl=Math.max(0,r.nvl+(r2()<0.5?-1:1));r.q=Math.max(0,r.q+Math.round((r2()-0.5)*4))}
  if(tick%12===0){const r=RACKS.filter(r=>rackState(r,NOW_WEEK)==="live")[Math.floor(r2()*300)];if(r){if(r.temp>66){alert(r.id+" inlet "+r.temp.toFixed(1)+"°C, throttling","crit")}else if(r.nvl>7)alert(r.id+" NVLink error rate "+r.nvl+"/h","warn");else alert("heartbeat: "+r.id+" nominal","ok")}}
  document.getElementById("h-clock").textContent=new Date().toLocaleTimeString("en-AU",{hour12:false,timeZone:"Australia/Sydney"});
  document.getElementById("h-tel").textContent=fmt(RACKS.filter(r=>["live","degraded"].includes(rackState(r,NOW_WEEK))).length*72)+" GPU streams";
  if(TAB==="telemetry"){const live=RACKS.filter(r=>["live","degraded","fault","maintenance"].includes(rackState(r,NOW_WEEK)));const show=live.filter((r,i)=>i%Math.ceil(live.length/28)===0).slice(0,28);const tb=document.getElementById("telebody");if(tb)tb.innerHTML=teleRows(show)}
  if(TAB==="command"&&tick%2===0)drawMap();
  drawRadar();
},1000);
